name: Run production migrator

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Migration step to execute"
        required: true
        type: choice
        options:
          - "01"
          - "migrate"
          - "02"
          - "seed"
          - "verify"

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::309490997821:role/scope-prod-github-actions-deploy
          aws-region: us-east-1

      - name: Resolve migrator command
        id: command
        shell: bash
        env:
          STEP: ${{ inputs.step }}
        run: |
          case "$STEP" in
            01)
              COMMAND='["psql","-v","ON_ERROR_STOP=1","-f","/app/infra/terraform/sql/01-bootstrap-scope-app-role.sql"]'
              ;;
            migrate)
              COMMAND='["npx","prisma","migrate","deploy","--schema","prisma/schema.prisma"]'
              ;;
            02)
              COMMAND='["psql","-v","ON_ERROR_STOP=1","-f","/app/infra/terraform/sql/02-grant-scope-app-on-existing-objects.sql"]'
              ;;
            seed)
              COMMAND='["npm","run","db:seed"]'
              ;;
            verify)
              COMMAND='["npm","run","db:verify-demo"]'
              ;;
            *)
              echo "Unsupported migration step: $STEP" >&2
              exit 1
              ;;
          esac

          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"

      - name: Run migrator task
        id: run
        shell: bash
        env:
          COMMAND: ${{ steps.command.outputs.command }}
        run: |
          OVERRIDES="$(jq -cn --argjson command "$COMMAND" '{
            containerOverrides: [
              {
                name: "migrator",
                command: $command
              }
            ]
          }')"

          TASK_ARN="$(aws ecs run-task \
            --cluster scope-prod-cluster \
            --task-definition scope-prod-migrator \
            --launch-type FARGATE \
            --network-configuration 'awsvpcConfiguration={subnets=[subnet-075ecbc2b61716fef,subnet-0d58aa21130801c05],securityGroups=[sg-0b7284f9025ac2749],assignPublicIp=ENABLED}' \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)"

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ECS did not return a task ARN." >&2
            exit 1
          fi

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Started $TASK_ARN"

      - name: Wait for migrator
        shell: bash
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          aws ecs wait tasks-stopped \
            --cluster scope-prod-cluster \
            --tasks "$TASK_ARN"

          aws ecs describe-tasks \
            --cluster scope-prod-cluster \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].{ExitCode:exitCode,Reason:reason,LastStatus:lastStatus}' \
            --output table

          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster scope-prod-cluster \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migrator failed with exit code $EXIT_CODE." >&2
            exit 1
          fi
